<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEAP Balance Dashboards</title>
  <style>
:root {
  color-scheme: light;
  --page-padding-x: clamp(12px, 1.8vw, 24px);
  --page-padding-y: clamp(14px, 1.8vw, 24px);
  --body-font-size: clamp(15px, 0.22vw + 14px, 18px);
  --title-font-size: clamp(24px, 0.75vw + 18px, 34px);
  --section-title-size: clamp(18px, 0.45vw + 14px, 24px);
}
html { background: #f4f6f8; }
body {
  font-family: Segoe UI, Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #111;
  font-size: var(--body-font-size);
  line-height: 1.45;
  min-width: 320px;
}
a { color: #0b3d5c; text-decoration: none; }
a:hover { text-decoration: underline; }
.page-shell { width: 100%; max-width: none; margin: 0 auto; padding: 0 var(--page-padding-x) 32px; box-sizing: border-box; }
.page-header {
  position: sticky;
  top: 0;
  z-index: 100;
  margin: 0 0 14px 0;
  padding: var(--page-padding-y) 0 10px 0;
  background: rgba(244, 246, 248, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #d8dee4;
}
.header-main-row { display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px; }
.header-side-controls {
  display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;
  gap:8px 10px;flex:1 1 460px;
}
.header-inline-controls {
  display:flex;align-items:center;gap:8px;justify-content:flex-end;
  flex:0 0 auto;flex-wrap:nowrap;margin-left:auto;
}
.dashboard-context {
  margin-top:6px;
  color:#4b5563;
  font-size:13px;
  line-height:1.35;
}
.economy-switch {
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
}
.economy-switch label {
  color:#4b5563;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.economy-switch select {
  max-width:240px;
  padding:6px 30px 6px 8px;
  border:1px solid #c5ccd3;
  border-radius:6px;
  background:#fff;
  color:#0b3d5c;
  font-size:13px;
}
.header-links { display: flex; flex-wrap: wrap; gap: 8px; }
.header-chip {
  padding: 6px 10px;
  border: 1px solid #c5ccd3;
  border-radius: 6px;
  background: #fff;
  color: #0b3d5c;
  font-size: 13px;
  text-decoration: none;
}
.header-chip[data-current="true"] {
  border-color:#1f6feb;
  box-shadow:0 0 0 2px rgba(31, 111, 235, 0.16);
  font-weight:700;
}
.header-nav-separator {
  color:#6b7280;
  font-weight:700;
  line-height:1.25;
  padding:6px 2px;
}
.header-toggle {
  width: 30px;
  height: 30px;
  border: 1px solid #c5ccd3;
  border-radius: 999px;
  background: #fff;
  color: #0b3d5c;
  cursor: pointer;
}
.header-toggle-row {
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}
.page-header.is-collapsed .header-collapsible { display: none; }
.page-header.is-collapsed {
  padding-bottom:0;
  background:transparent;
  backdrop-filter:none;
  border-bottom-color:transparent;
}
.page-header.is-collapsed .header-toggle-row { margin-top:0; }
.jump-nav {
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #d8dee4;
  display:flex;
  flex-wrap:wrap;
  gap:8px 10px;
  align-items:flex-start;
}
.jump-nav-label {
  font-weight:600;
  color:#4b5563;
  font-size:12px;
  white-space:nowrap;
  padding-top:4px;
}
.jump-nav-groups {
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
  flex:1 1 640px;
}
.jump-nav-row {
  display:flex;
  flex-wrap:wrap;
  gap:6px 8px;
  align-items:center;
  min-width:0;
}
.jump-nav-row[data-level="2"] { padding-left:18px; }
.jump-nav-row[data-level="3"] { padding-left:36px; }
.jump-nav-row[data-level="4"] { padding-left:54px; }
.jump-chip {
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  border:1px solid #c5ccd3;
  border-radius:999px;
  background:#fff;
  color:#0b3d5c;
  text-decoration:none;
  font-size:12px;
  line-height:1.25;
  box-shadow:0 1px 1px rgba(15, 23, 42, 0.04);
}
.jump-chip::before {
  content:"";
  display:block;
  width:8px;
  height:8px;
  border-radius:999px;
  flex:0 0 auto;
  background:#94a3b8;
}
.jump-chip[data-level="1"] {
  background:#fff4e6;
  border-color:#f2a65a;
  color:#7a3b00;
}
.jump-chip[data-level="1"]::before { background:#f97316; }
.jump-chip[data-level="2"] {
  background:#f5edff;
  border-color:#c69af0;
  color:#4c1d70;
}
.jump-chip[data-level="2"]::before { background:#9333ea; }
.jump-chip[data-level="3"], .jump-chip[data-level="4"] {
  background:#f8fafc;
  border-color:#cbd5e1;
  color:#334155;
}
.jump-chip[data-level="3"]::before, .jump-chip[data-level="4"]::before { background:#94a3b8; }
.jump-chip[data-current="true"] {
  border-color:#1f6feb;
  box-shadow:0 0 0 2px rgba(31, 111, 235, 0.16);
  font-weight:700;
}
.jump-nav-separator {
  color:#6b7280;
  font-weight:700;
  line-height:1.25;
  padding:4px 2px;
}
.section-link-list {
  margin:0 0 14px 0;
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.section-link-list li {
  line-height:1.35;
}
.section-link-list li[data-level="2"] { padding-left:18px; }
.section-link-list li[data-level="3"] { padding-left:36px; }
.section-link-list li[data-level="4"] { padding-left:54px; }
.section-link-list a {
  color:#0b3d5c;
  text-decoration:none;
  font-weight:600;
}
.section-card {
  margin: 10px 0 14px 0;
  padding: 10px;
  border: 1px solid #d6dde5;
  border-radius: 8px;
  background: #fff;
}
.section-note {
  margin: 10px 0 14px 0;
  padding: 12px;
  border: 1px dashed #c5ccd3;
  border-radius: 8px;
  background: #fff;
  color: #4b5563;
}
.meta-line { margin-bottom: 8px; font-weight: 600; color: #1f2d3d; }
.meta-subline { margin-top: -4px; margin-bottom: 8px; color: #4b5563; font-size: 12px; }
.others-note { display: block; margin-top: 6px; font-size: 10px; color: #888; line-height: 1.4; }
.visible-note { margin: 8px 0 10px 0; padding: 8px 12px; background: #fffbe6; border-left: 3px solid #f0a500; border-radius: 4px; font-size: 13px; color: #5a3e00; line-height: 1.5; }
.dashboard-grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:12px;
  align-items:start;
}
.dashboard-grid.expand-1 { grid-template-columns:minmax(0, 1fr); }
.dashboard-grid.expand-2 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
.dashboard-grid.expand-3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.chart-card {
  margin:0;
  padding:10px;
  border:1px solid #d0d7de;
  border-radius:8px;
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,0.05);
}
.chart-caption {
  font-weight:600;
  margin-bottom:4px;
}
.lazy-chart-frame {
  width: 100%;
  height: clamp(380px, 62vh, 1100px);
  border: 1px solid #d0d7de;
  border-radius: 6px;
  background: #fff;
  display: block;
  box-sizing: border-box;
}
.lazy-chart-plot {
  width: 100%;
  height: clamp(380px, 62vh, 1100px);
  border: 1px solid #d0d7de;
  border-radius: 6px;
  background: #fff;
  display: block;
  box-sizing: border-box;
}
.lazy-chart-frame.is-unloaded, .lazy-chart-plot.is-unloaded {
  background:#f8fafc;
}
.chart-load-state {
  min-height:22px;
  margin:4px 0 6px 0;
  color:#64748b;
  font-size:12px;
}
.chart-load-state[data-loaded="true"] { display:none; }
@media (max-width: 720px) {
  .dashboard-grid { grid-template-columns:minmax(0, 1fr); }
  .lazy-chart-frame, .lazy-chart-plot { height: 420px; }
}

.home-layout { max-width: 960px; padding-top: 28px; }
.home-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:18px; }
.home-card { display:block; padding:16px; border:1px solid #d0d7de; border-radius:8px; background:#fff; color:#0b3d5c; text-decoration:none; }
.home-card:hover { border-color:#1f6feb; box-shadow:0 2px 8px rgba(15, 23, 42, 0.08); text-decoration:none; }
.home-card-title { display:block; font-size:18px; font-weight:700; color:#111827; }
.home-card-subtitle { display:block; margin-top:4px; font-size:13px; color:#64748b; }
.home-empty { color:#64748b; }
  </style>
</head>
<body>
  <div class="page-shell home-layout">
    <h1 style="margin:0;font-size:28px;line-height:1.15;">LEAP Balance Dashboards</h1>
    <p style="margin:8px 0 0 0;color:#4b5563;">Choose an economy dashboard.</p>
    <div class="home-grid"><a class="home-card" href="NZ/dashboards/node__Buildings.html"><span class="home-card-title">New Zealand</span><span class="home-card-subtitle">NZ</span></a><a class="home-card" href="USA/dashboards/node__Buildings.html"><span class="home-card-title">United States</span><span class="home-card-subtitle">USA</span></a></div>
  </div>
</body>
</html>
