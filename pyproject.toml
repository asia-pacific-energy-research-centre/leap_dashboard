[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "leap_dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "plotly",
    "jinja2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codebase*"]
